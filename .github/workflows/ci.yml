name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore API dependencies
      run: dotnet restore Intelectia.API/Intelectia.API.csproj

    - name: Build API solution
      run: dotnet build Intelectia.API/Intelectia.API.csproj --no-restore --configuration Release

    - name: Run code analysis for API
      run: dotnet build Intelectia.API/Intelectia.API.csproj /p:EnforceCodeStyleInBuild=true /warnaserror

    - name: Run unit tests
      run: dotnet test --no-build --configuration Release --verbosity normal
      # Nota: Los tests se ejecutarán cuando se implementen. Por ahora, el paso pasa si no hay tests.
      continue-on-error: true

    - name: Verify Docker build
      run: docker build -t intelectia-ci-test .
