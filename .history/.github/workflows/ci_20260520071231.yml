    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Restauramos solo el proyecto de la API
    - name: Restore API dependencies
      run: dotnet restore Intelectia.API/Intelectia.API.csproj

    # Compilamos solo la API y sus dependencias directas
    - name: Build API solution
      run: dotnet build Intelectia.API/Intelectia.API.csproj --no-restore --configuration Release

    # Análisis de código solo en la API
    - name: Run code analysis
      run: dotnet build Intelectia.API/Intelectia.API.csproj /p:EnforceCodeStyleInBuild=true /warnaserror --no-restore

    # Tests en proyectos de prueba que no dependan de WPF
    - name: Run unit tests
      run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~Intelectia.WPF" || echo "No tests found or WPF tests skipped, continuing..."

    # Validamos que el Dockerfile de la API compile correctamente
    - name: Verify Docker build
      run: docker build -t intelectia-ci-test -f Dockerfile .
