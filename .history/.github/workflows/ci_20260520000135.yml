name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Run code analysis
      run: dotnet build /p:EnforceCodeStyleInBuild=true /warnaserror

    - name: Run unit tests
      run: dotnet test --no-build --configuration Release --verbosity normal
      # Nota: Los tests se ejecutarán cuando se implementen. Por ahora, el paso pasa si no hay tests.

    - name: Verify Docker build
      run: docker build -t intelectia-ci-test .
      # Validamos que el Dockerfile compile correctamente en CI
