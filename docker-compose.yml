services:
  intelectia.api:
    image: intelectia-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=intelectia.db;Port=5432;Database=IntelectiaDb;Username=postgres;Password=postgres
      - JwtSettings__Secret=dev_secret_key_change_in_production
      - JwtSettings__Issuer=Intelectia
      - JwtSettings__Audience=IntelectiaUsers
    depends_on:
      intelectia.db:
        condition: service_healthy
    restart: unless-stopped

  intelectia.db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=IntelectiaDb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
